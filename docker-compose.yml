# D&D Мастерская — Docker Compose
# Развёртывание: docker compose up --build
version: '3.8'

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dnd_workshop
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: dnd_workshop
      UPLOAD_DIR: /app/uploads
      CORS_ORIGIN: http://localhost:3001
    volumes:
      - uploads:/app/uploads
    ports:
      - "3001:3001"
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
